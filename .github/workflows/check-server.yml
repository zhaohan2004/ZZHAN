name: Check server SSH

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
    steps:
      - name: Verify SSH and Docker access
        shell: bash
        run: |
          set -euo pipefail
          : "${SERVER_HOST:?Missing SERVER_HOST}"
          : "${SERVER_USER:?Missing SERVER_USER}"
          : "${SERVER_PORT:?Missing SERVER_PORT}"
          : "${SERVER_SSH_KEY:?Missing SERVER_SSH_KEY}"
          : "${SERVER_KNOWN_HOSTS:?Missing SERVER_KNOWN_HOSTS}"
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          printf '%s\n' "$SERVER_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          ssh -i "$ssh_dir/key" -p "$SERVER_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 \
            "$SERVER_USER@$SERVER_HOST" \
            'whoami && docker --version && docker compose version && docker ps --format "{{.Names}}" >/dev/null'
