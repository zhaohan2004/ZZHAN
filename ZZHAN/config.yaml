# 应用配置
app:
  name: ZZHAN-api
  version: 1.0.0
  mode: release         # debug, release, test
  port: 9900

# ---------- 数据库配置 ----------
database:
  mysql:
    host: 127.0.0.1      # MySQL 主机
    port: 3306            # MySQL 端口
    username: root        # 用户名
    password: "123456"     # 密码
    database: zzhan       # 数据库名
    max_idle_conns: 10    # 最大空闲连接数
    max_open_conns: 100   # 最大打开连接数
  redis:
    host: 127.0.0.1       # Redis 主机
    port: 6379             # Redis 端口
    password: "123456"     # 密码
    db: 6                  # 数据库编号
    pool_size: 10          # 连接池大小

# JWT 配置
jwt:
  secret: "my-dev-secret-key-123"
  expire_hours: 24   # time.Duration 格式

# 日志配置
log:
  level: debug        # debug, info, warn, error
  filename: logs/app.log
  max_size: 100       # MB
  max_backups: 3
  max_age: 28         # 天
  compress: true

# CORS 配置
cors:
  enabled: true
  allow_origins:
    - http://localhost:3000
    - http://localhost:8080
  allow_methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allow_headers:
    - Origin
    - Content-Type
    - Accept
    - Authorization
  expose_headers:
    - Content-Length
    - Content-Disposition
  allow_credentials: true
  max_age: 86400      # 秒 (24小时)